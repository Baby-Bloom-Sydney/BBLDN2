name: CI

on:
  push:
    branches: [main, hub-migration]
  pull_request:
    branches: [main, hub-migration]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./app

env:
  # Non-functional placeholders so `next build` + the test suite don't crash on
  # missing env at module-load / prerender time. Real values come from Vercel at
  # deploy time; the build only collects page data, it never calls these services.
  # Without these, `next build` throws "Missing API key" (Resend) or
  # "Missing Supabase admin credentials" while prerendering. (T-048.)
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
  RESEND_API_KEY: re_ci_placeholder
  OPENAI_API_KEY: sk-ci-placeholder
  GOOGLE_AI_API_KEY: ci-placeholder
  STRIPE_SECRET_KEY: sk_test_ci_placeholder

jobs:
  install:
    name: Install deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Unit tests (Vitest)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    name: Next build
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build

  london-sweep:
    # The LDN2 Stage 2 whole-tree gate: fails while any Australian artefact class the Stage 1 inventory named is
    # still present anywhere in the tree (LDN2/PLAN/05-gate.md). It needs no database and no secrets.
    #
    # Blocking since W6 (2026-09-26). It ran `continue-on-error: true` through W0-W5 because the gate was RED by
    # design on the un-amended tree and its job was to publish a falling per-rule count for the units that followed.
    # Every place rule is now 0 and the identity/jurisdiction residue is allow-listed to the stage that owns it, so
    # the only way this job goes red again is a new Australian artefact or an allow entry that has outlived its
    # reason. See LDN2/PLAN/LEDGER/W6-gate.md.
    name: London sweep
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check:london
